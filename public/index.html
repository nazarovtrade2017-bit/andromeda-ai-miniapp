<style>
:root {
  --bg: #0E1A14;

}

@property --p{syntax:'<number>';inherits:false;initial-value:0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}

.app{max-width:448px;margin:0 auto;padding:env(safe-area-inset-top,0) 16px 0}
header{display:flex;justify-content:center;padding:16px 0 8px}

.brand .g{color:var(--gold)}

main{padding:8px 0 110px}main.in>*{animation:up .35s cubic-bezier(.2,.8,.2,1)}@keyframes up{from{opacity:0;transform:translateY(10px)}}

.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--sh);margin-top:12px;transition:transform .3s,border-color .3s,box-shadow .3s}

input{width:100%;padding:13px;border-radius:14px;border:1px solid var(--line);background:var(--card-dark);font-size:14px;outline:0;margin-bottom:8px;color:var(--text)}input:focus{border-color:var(--gold)}

<script>
var tg = window.Telegram?.WebApp || {};
try {
  tg.ready();
  tg.expand();
  try { tg.setHeaderColor("#0E1A14"); tg.setBackgroundColor("#0E1A14"); } catch(x) {}
} catch(e) {}

// Функция отправки действий на бэкенд (Railway + MySQL)
function sendServerAction(actionType, extraData = {}) {
  try {
    const initData = tg.initData || "";
    const user = tg.initDataUnsafe?.user || { id: "test_user_id", first_name: "TestUser" };

    const payload = {
      user_id: user.id,
      username: user.username || "",
      first_name: user.first_name || "",
      action: actionType,
      timestamp: new Date().toISOString(),
      initData: initData,
      ...extraData
    };

   // Отправка запроса на ваш сервер в Railway
 fetch('/api/track', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `tma ${initData}` // <--- Обязательно с префиксом "tma "
    },
    body: JSON.stringify(payload)
  })
  }).catch(err => {
    console.warn("Server action tracking warning:", err);
  });
}

// При старте приложения логируем вход пользователя
window.addEventListener('DOMContentLoaded', () => {
  sendServerAction('app_launch', { tab: 'f' });
});

  s = s || 20;
  return '<i data-lucide="' + name + '" style="width:' + s + 'px; height:' + s + 'px; stroke-width:1.8px;"></i>';
}

var FREE_LIMIT = 3;
function todayKey(){var d=new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
S.free = {d: todayKey(), n: 0};
try{var fq=JSON.parse(localStorage.getItem("ws_free_quota")||"null");if(fq&&fq.d===todayKey()&&fq.n>0)S.free=fq}catch(e){}
function freeUsed(){if(S.free.d!==todayKey())S.free={d:todayKey(),n:0};return S.free.n}
function freeLeft(){return Math.max(0,FREE_LIMIT-freeUsed())}
function freeUse(){freeUsed();S.free.n++;try{localStorage.setItem("ws_free_quota",JSON.stringify(S.free))}catch(e){}}
function isGated(){return !S.isAuthorized&&freeLeft()===0&&S.ph==="idle"}

function strHash(s) {
  var h = 0;
  for (var i = 0; i < s.length; i++) h = (Math.imul(31, h) + s.charCodeAt(i)) | 0;
  return Math.abs(h);
}

function calc(asset, tf){
  var x = strHash(asset + tf + new Date().toDateString());
  var moods = S.lang=="en"? MOODS_EN : MOODS_RU;
  return {a:asset, tf:tf, p:35+x%64, e:(x>>>5)%101, m:moods[(x>>>9)%moods.length]};
}

function getDailyWinrate() {
    const now = new Date();
    const utcTime = now.getTime() + (now.getTimezoneOffset() * 60000);
    const targetTime = new Date(utcTime + (3 * 3600000));
    const year = targetTime.getFullYear();
    const month = targetTime.getMonth();
    const day = targetTime.getDate();
    const seed = year * 10000 + (month + 1) * 100 + day;
    const random = Math.sin(seed) * 10000;
    const dayPseudoRandom = random - Math.floor(random);
    const min = 73;
    const max = 89;
    return Math.floor(dayPseudoRandom * (max - min + 1)) + min;
}

function reset(){clearInterval(S.tm);S.ph="idle";S.r=null}

function start(){
  if(!S.isAuthorized){
    if(freeLeft()===0){R();return}
    freeUse();
  }
  hap();
  clearInterval(S.tm);
  S.ph="load";
  S.r=null;
  closeMenuSmoothly();
  R();
  
  sendServerAction('request_signal', { asset: S.asset, timeframe: S.tf });

  setTimeout(function(){
    S.r=calc(S.asset,S.tf);
    S.ph="res";
    S.t=15;
    R();
    S.tm=setInterval(function(){
      S.t--;
      if(S.t<=0){clearInterval(S.tm);S.t=0}
      var e=$("tt");
      if(e){e.textContent="00:"+("0"+S.t).slice(-2)+"/00:15"}
      if(S.t==0)R()
    },1000)
  },2500)
}

function decide(st){
  clearInterval(S.tm);
  S.hist.unshift({a:S.r.a, tf:S.r.tf, p:S.r.p, m:S.r.m, st:st, date:new Date().toLocaleTimeString()});
  save();
  toast(st=="ok" ? t("inWorkToast") : t("skipToast"));
  
  sendServerAction('signal_decision', { asset: S.r.a, timeframe: S.r.tf, decision: st });
  
  reset();
  R();
}

function toggleMenu(targetMenu) {
  var wrapper = $("drop-wrapper");
  var inner = $("drop-inner");
  var pillAsset = $("btn-pill-asset");
  var pillTf = $("btn-pill-tf");

  if (S.openMenu === targetMenu) {

    S.openMenu = targetMenu;
    if (pillAsset) pillAsset.classList.toggle("on", targetMenu === 'asset');
    if (pillTf) pillTf.classList.toggle("on", targetMenu === 'tf');

      if (targetMenu === 'asset') {
        inner.innerHTML = '<div class="inline-dropdown">' + renderAssetContent() + '</div>';
        bindListEvents();
        var srchInp = $('asset-srch');
        if (srchInp) {
          srchInp.focus();

    });
  }

  v.innerHTML=h;
  if(window.lucide) lucide.createIcons();

  var navH='<button class="'+(S.tab=="p"?"on":"")+'" onclick="switchTab(\'p\')">'+ic("user", 20)+'<span>'+t("navProfile")+'</span></button>';
  navH+='<button class="'+(S.tab=="h"?"on":"")+'" onclick="switchTab(\'h\')">'+ic("history", 20)+'<span>'+t("navHistory")+'</span></button>';
  navH+='<button class="c '+(S.tab=="f"?"on":"")+'" onclick="switchTab(\'f\')"><i class="nav-center-icon">'+ic("zap", 24)+'</i><span>'+t("navSignals")+'</span></button>';
  navH+='<button class="'+(S.tab=="ai"?"on":"")+'" onclick="switchTab(\'ai\')">'+ic("bot", 20)+'<span>'+t("navAi")+'</span></button>';
  navH+='<button class="'+(S.tab=="s"?"on":"")+'" onclick="switchTab(' + "'s'" + ')">'+ic("headphones", 20)+'<span>'+t("navSupport")+'</span></button>';
  nav.innerHTML=navH;
  if(window.lucide) lucide.createIcons();
}

R();
</script>
