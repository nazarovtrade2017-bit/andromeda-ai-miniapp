<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1A14">
<title>Andromeda AI signals</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="icons.js"></script>
<style>
:root {
  --bg: #0E1A14;
  --card: #15241C;
  --card-dark: #0B1410;
  --line: rgba(212, 175, 55, 0.22);
  --line-gold: rgba(212, 175, 55, 0.5);
  --text: #F4F1EA;
  --mute: #9CA89F;
  --mute2: #6B786E;
  --gold: #D4AF37;
  --gold2: #AA7C11;
  --sand: #1C2E24;
  --ok: #10B981;
  --bad: #EF4444;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sh: 0 8px 30px rgba(0, 0, 0, 0.5);
  --halo: 0 0 20px rgba(212, 175, 55, 0.18);
  --halo-strong: 0 0 25px rgba(212, 175, 55, 0.35);
}

@property --p{syntax:'<number>';inherits:false;initial-value:0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}

.app{max-width:448px;margin:0 auto;padding:env(safe-area-inset-top,0) 16px 0}
header{display:flex;justify-content:center;padding:16px 0 8px}

.brand{display:flex;align-items:center;gap:8px;background:rgba(21, 36, 28, 0.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line-gold);border-radius:999px;padding:7px 20px;box-shadow:var(--halo);font-weight:900;letter-spacing:.14em;font-size:15px;color:var(--text)}
.brand .g{color:var(--gold)}
.brand i{color:var(--gold);display:inline-flex;}

main{padding:8px 0 110px}main.in>*{animation:up .35s cubic-bezier(.2,.8,.2,1)}@keyframes up{from{opacity:0;transform:translateY(10px)}}

.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--sh);margin-top:12px;transition:transform .3s,border-color .3s,box-shadow .3s}
.card:hover{transform:translateY(-2px);border-color:var(--line-gold);box-shadow:var(--halo-strong)}
.big{border-radius:28px;display:grid;gap:12px}.big:hover{transform:none}

.dep-card{background:var(--card);border:1px solid var(--line-gold);border-radius:20px;padding:16px;margin-top:10px;box-shadow:var(--halo)}
.dep-header{display:flex;gap:12px;align-items:flex-start}
.dep-icon{width:36px;height:36px;border-radius:10px;background:var(--sand);border:1px solid var(--line);display:grid;place-items:center;color:var(--gold);flex:none;font-weight:700;font-size:18px}
.dep-title{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;font-weight:800;font-size:15px}
.badge-rec{background:rgba(212, 175, 55, 0.15);color:var(--gold);border:1px solid var(--line-gold);font-size:10px;font-weight:800;padding:2px 8px;border-radius:999px;letter-spacing:.04em;text-transform:uppercase}
.dep-desc{font-size:12px;color:var(--mute);line-height:1.45;margin-top:6px}
.dep-btns{display:grid;gap:8px;margin-top:14px}

.promo-card{background:linear-gradient(135deg, #182C22 0%, #0B1410 100%);border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:12px}
.promo-title{font-weight:800;font-size:15px;color:var(--text);display:flex;align-items:center;gap:8px}
.promo-code{display:inline-flex;align-items:center;gap:8px;background:var(--card-dark);border:1px dashed var(--gold);color:var(--gold);font-family:var(--mono);font-weight:800;font-size:15px;padding:8px 16px;border-radius:12px;margin:10px 0;cursor:pointer;transition:transform .15s}
.promo-code:active{transform:scale(.96)}
.promo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.promo-item{background:var(--sand);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center;font-size:12px;color:var(--mute)}
.promo-item b{display:block;color:var(--gold);font-size:13px;margin-top:2px}

.pro-card{background:linear-gradient(135deg, #182C22 0%, #0B1410 100%);border:1px solid var(--gold);border-radius:20px;padding:16px;box-shadow:var(--halo-strong);margin-top:14px;position:relative;overflow:hidden}
.pro-card::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle, rgba(212,175,55,0.08) 0%, transparent 60%);pointer-events:none}
.pro-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.pro-badge{display:flex;align-items:center;gap:6px;background:linear-gradient(90deg, var(--gold), var(--gold2));color:#0E1A14;font-weight:900;font-size:11px;padding:3px 10px;border-radius:999px;letter-spacing:.08em;text-transform:uppercase}

h2,h3{margin:0;font-weight:800;color:var(--text)}h2{font-size:24px;margin-top:6px}h3{font-size:18px}
.mute{color:var(--mute);font-size:12px}.center{text-align:center}.mono{font-family:var(--mono);color:var(--gold)}

.sand{background:var(--sand);border:1px solid var(--line);border-radius:16px;padding:12px;display:block}.sand b{display:block;font-size:16px;margin-top:2px;color:var(--text)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.pills{display:flex;gap:10px;justify-content:center;margin-top:12px}
.pill{flex:1;display:flex;align-items:center;gap:8px;justify-content:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;font:600 13px system-ui;color:var(--text);box-shadow:var(--sh);cursor:pointer;transition:transform .15s,border-color .2s,box-shadow .2s}
.pill:hover,.pill.on{border-color:var(--gold);box-shadow:var(--halo)}.pill:active{transform:scale(.96)}.pill i{color:var(--gold);display:inline-flex;}
.pill .ic-dn{transition:transform .3s cubic-bezier(.2,.8,.2,1);display:inline-flex;}
.pill.on .ic-dn{transform:rotate(180deg)}

/* Плавный выпадающий блок */
.dropdown-wrapper{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s cubic-bezier(.2,.8,.2,1);}
.dropdown-wrapper.open{grid-template-rows:1fr;}
.dropdown-inner{overflow:hidden;}

.inline-dropdown{background:var(--card);border:1px solid var(--line-gold);border-radius:18px;padding:10px;margin-top:10px;box-shadow:var(--halo);transition:opacity .25s ease, transform .25s ease;}

.search-box{margin-bottom:6px}
.search-box input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card-dark);font-size:13px;outline:0;color:var(--text);transition:border-color .2s;}
.search-box input:focus{border-color:var(--gold)}

.list-group-title{font-size:11px;font-weight:800;color:var(--gold);letter-spacing:.08em;padding:8px 8px 4px;text-transform:uppercase;}

.flat-list{display:flex;flex-direction:column;max-height:300px;overflow-y:auto;padding-right:2px;}
.flat-list::-webkit-scrollbar{width:4px}
.flat-list::-webkit-scrollbar-thumb{background:var(--line-gold);border-radius:4px}

.list-item{width:100%;padding:10px 12px;border:0;border-bottom:1px solid rgba(212, 175, 55, 0.08);background:transparent;font:500 13px system-ui;color:var(--text);cursor:pointer;text-align:left;display:flex;align-items:center;gap:10px;transition:background .15s, color .15s;}
.list-item:last-child{border-bottom:0}
.list-item:active,.list-item:hover{background:rgba(212, 175, 55, 0.08)}
.list-item.on{background:rgba(212, 175, 55, 0.18);color:var(--gold);font-weight:700;}

.btn{width:100%;border:0;border-radius:16px;padding:14px;font:700 14px system-ui;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;color:#0E1A14;background:linear-gradient(135deg, var(--gold), var(--gold2));box-shadow:var(--halo-strong);transition:transform .15s,box-shadow .2s,filter .2s;text-decoration:none}
.btn:hover{filter:brightness(1.1);box-shadow:0 0 30px rgba(212,175,55,0.5)}.btn:active{transform:scale(.97)}
.btn.out{background:transparent;color:var(--text);border:1px solid var(--line);box-shadow:none}.btn.out:hover{border-color:var(--gold);color:var(--gold)}
.btn.dk{background:var(--card-dark);color:var(--gold);border:1px solid var(--line);box-shadow:none}
.btn.danger{background:transparent;color:#EF4444;border:1px solid rgba(239, 68, 68, 0.3);box-shadow:none}
.btn.danger:hover{border-color:#EF4444;background:rgba(239,68,68,0.05)}
.two .btn{padding:13px;font-size:14px}

.ring{width:116px;height:116px;border-radius:50%;margin:10px auto 2px;display:grid;place-items:center;background:conic-gradient(var(--gold) calc(var(--p)*1%),var(--line) 0);animation:fill 1s cubic-bezier(.2,.8,.2,1);box-shadow:var(--halo)}@keyframes fill{from{--p:0}}
.ring span{width:90px;height:90px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:900;font-size:26px;color:var(--gold)}
.sand .ring span{background:var(--sand)}

.spin{width:56px;height:56px;border-radius:50%;border:2px solid rgba(212,175,55,.15);border-top-color:var(--gold);animation:sp 1s linear infinite;margin:36px auto 16px;box-shadow:var(--halo)}@keyframes sp{to{transform:rotate(360deg)}}
.sp{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:500}
.chip{font-style:normal;font-size:10px;font-weight:700;padding:2px 8px;border-radius:7px}.chip.ok{background:rgba(16,185,129,0.15);color:var(--ok);border:1px solid rgba(16,185,129,0.3)}.chip.bad{background:rgba(239,68,68,0.15);color:var(--bad);border:1px solid rgba(239,68,68,0.3)}

.rec{border:1px solid rgba(239,68,68,0.3);background:rgba(239,68,68,0.08);border-radius:16px;padding:12px;font-size:13px;line-height:1.45;color:#FCA5A5}.rec b{color:var(--bad)}

.tag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--sand);color:var(--gold);border:1px solid var(--line)}.tag.s{color:var(--mute);border-color:var(--line)}

.top{display:grid;grid-template-columns:1fr 1fr;gap:12px}.top .card{margin:0;text-align:center;text-decoration:none;color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;margin-top:12px;padding:20px 12px;}.top b{font-size:13px;color:var(--text);margin-top:6px;}.top small{display:block;color:var(--mute);font-size:10px;margin-top:2px}

.faq{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-top:8px;overflow:hidden;transition:border-color .3s}.faq:hover{border-color:var(--gold)}
.qb{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 16px;background:none;border:0;font:600 13px system-ui;color:var(--text);text-align:left;cursor:pointer}
.qb i{color:var(--mute);flex:none;transition:transform .3s;display:inline-flex;}.faq.o .qb i{transform:rotate(180deg);color:var(--gold)}
.fa{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s}.faq.o .fa{grid-template-rows:1fr}.fa>div{overflow:hidden}.fa p{margin:0;padding:6px 16px 14px;border-top:1px solid var(--line);color:var(--mute);font-size:13px;line-height:1.55}

.chat div.m{padding:10px 14px;border-radius:18px;margin:8px 0;max-width:86%;font-size:14px;line-height:1.45}.chat .a{background:var(--card);border:1px solid var(--line);color:var(--text)}.chat .u{background:linear-gradient(135deg, var(--gold), var(--gold2));color:#0E1A14;font-weight:600;margin-left:auto}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.chips button{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 12px;font:12px system-ui;color:var(--text);cursor:pointer;transition:border-color .2s,color .2s}.chips button:hover{border-color:var(--gold);color:var(--gold)}

/* Profile Screen Custom UI */
.prof-user-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.prof-avatar{width:44px;height:44px;border-radius:50%;background:rgba(212,175,55,0.12);border:1px solid var(--line-gold);display:grid;place-items:center;color:var(--gold)}
.prof-stats-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.prof-stat-box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 8px;text-align:center}
.prof-stat-val{font-size:20px;font-weight:900;color:var(--gold);font-family:var(--mono)}
.prof-stat-lbl{font-size:11px;color:var(--mute);margin-top:4px}

.prof-section{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin-top:12px}
.prof-sec-title{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:6px;margin-bottom:10px}

.lang-switch{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--card-dark);padding:4px;border-radius:14px;border:1px solid var(--line)}
.lang-btn{border:0;background:transparent;color:var(--mute);padding:8px;border-radius:10px;font:700 12px system-ui;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;transition:all .2s}
.lang-btn.on{background:linear-gradient(135deg, var(--gold), var(--gold2));color:#0E1A14;box-shadow:var(--halo)}
.lang-flag{font-size:10px;font-weight:900;background:rgba(0,0,0,0.25);padding:2px 5px;border-radius:4px}

.select-box{width:100%;background:var(--card-dark);border:1px solid var(--line);color:var(--text);padding:10px 12px;border-radius:12px;font:500 13px system-ui;outline:0;cursor:pointer}
.select-box:focus{border-color:var(--gold)}

input{width:100%;padding:13px;border-radius:14px;border:1px solid var(--line);background:var(--card-dark);font-size:14px;outline:0;margin-bottom:8px;color:var(--text)}input:focus{border-color:var(--gold)}

nav{position:fixed;left:0;right:0;bottom:0;max-width:448px;margin:0 auto;background:rgba(14, 26, 20, 0.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0));z-index:5}
nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font:500 10px system-ui;color:var(--mute2);padding:4px 8px;cursor:pointer;transition:transform .15s}nav button:active{transform:scale(.92)}nav button.on{color:var(--gold)}nav button.on i{color:var(--gold)}
nav .c{margin-top:-26px;color:var(--mute)}nav .c.on{color:var(--gold)}nav .c i.nav-center-icon{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold2));display:grid;place-items:center;box-shadow:var(--halo-strong);color:#0E1A14}nav .c i.nav-center-icon svg{color:#0E1A14!important}

/* Demo chip + waiting spinner */
.chip.demo{background:rgba(212,175,55,.15);color:var(--gold);border:1px solid var(--line-gold);margin-left:4px}
/* Free-quota gate */
.quota{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--mute);margin-top:14px}
.quota i{color:var(--gold);display:inline-flex}.quota b{color:var(--gold);font-family:var(--mono)}
.gate{position:relative;margin-top:14px;border-radius:20px;overflow:hidden}
.gate-inner{filter:blur(7px);opacity:.55;pointer-events:none;user-select:none;-webkit-user-select:none}
.gate-inner>.pills{margin-top:0!important}
.gate-overlay{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:10px;text-align:center;padding:28px 20px;background:rgba(14,26,20,.45)}
.gate-overlay>i{color:var(--gold);display:inline-flex}
.gate-title{font-weight:800;font-size:16px;line-height:1.35;color:var(--text)}
.gate-sub{font-size:12px;color:var(--mute);line-height:1.45}

/* Asset list: schedule state */
.list-item .it-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-item .it-st{font-size:10px;font-weight:600;color:var(--ok);white-space:nowrap}
.list-item .otc-tag{font-size:9px;font-weight:800;color:var(--mute);border:1px solid var(--line);border-radius:5px;padding:1px 4px;margin-left:6px}
.list-item.closed{opacity:.5;cursor:default}
.list-item.closed .it-st{color:var(--mute)}
.sched-link{display:flex;align-items:center;justify-content:center;gap:6px;margin:10px auto 0;font:600 12px system-ui;color:var(--mute);cursor:pointer;background:none;border:0;padding:6px 10px}
.sched-link:hover{color:var(--gold)}.sched-link i{display:inline-flex;color:var(--gold)}
.sched-row{background:var(--card-dark);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;text-align:left}
.sched-name{font-weight:800;font-size:13px}
.sched-hours{font-family:var(--mono);color:var(--gold);font-size:13px;font-weight:700;margin-top:6px}
.day-chips{display:flex;gap:4px;margin-top:8px}
.day-chip{flex:1;text-align:center;font:700 10px system-ui;padding:5px 0;border-radius:6px;border:1px solid var(--line);color:var(--mute2)}
.day-chip.on{background:rgba(16,185,129,.14);border-color:rgba(16,185,129,.4);color:var(--ok)}
.day-chip.now{box-shadow:0 0 0 1px var(--gold)}
.promo-inline{display:inline-block;font-family:var(--mono);font-weight:800;color:var(--gold);border:1px dashed var(--gold);border-radius:6px;padding:0 6px;cursor:pointer}
.pop{animation:pop .6s cubic-bezier(.2,.8,.2,1)}@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}

/* Asset icons (drawn by icons.js) */
.ai{position:relative;display:inline-grid;place-items:center;flex:none;border-radius:50%;overflow:hidden;background:var(--sand);box-shadow:inset 0 0 0 1px rgba(255,255,255,.10)}
.ai>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.ai-t{position:relative;font-weight:800;color:#fff;letter-spacing:-.02em;line-height:1;white-space:nowrap}
.ai-img{width:100%;height:100%;object-fit:cover;display:block}
.ai-pair{display:inline-flex;align-items:center;flex:none}
.ai-pair .ai-b{box-shadow:0 0 0 2px var(--card),inset 0 0 0 1px rgba(255,255,255,.10)}
.ai-tab{flex:none;display:block}
.pill-asset{display:inline-flex;align-items:center;gap:8px;min-width:0}
.pill-asset>span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#lbl-asset{min-width:0;overflow:hidden}
.h-ico{display:flex;align-items:center;gap:10px}

/* Asset picker: sections, rows, favourites */
.cat-tabs{position:relative;display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.cat-tabs::-webkit-scrollbar{display:none}
.cat-tab{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card-dark);color:var(--mute);border-radius:12px;padding:8px 11px;font:700 11px system-ui;cursor:pointer;white-space:nowrap;transition:border-color .2s,color .2s,background .2s}
.cat-tab:active{transform:scale(.96)}
.cat-tab.on{background:rgba(212,175,55,.16);border-color:var(--gold);color:var(--gold)}
.cat-tab.sched{border-style:dashed}
.cat-tabs.searching .cat-tab.on{background:var(--card-dark);border-color:var(--line);color:var(--mute)}
.list-item{user-select:none;-webkit-user-select:none}
.list-item .it-ico{width:52px;display:flex;align-items:center;flex:none}
.list-item .fav-btn{background:none;border:0;padding:5px;margin:-5px 0 -5px -6px;color:var(--mute2);cursor:pointer;display:inline-grid;place-items:center;flex:none;transition:color .15s,transform .15s}
.list-item .fav-btn:active{transform:scale(.8)}
.list-item .fav-btn.on{color:var(--gold)}.list-item .fav-btn.on svg{fill:currentColor}

/* MODALS */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(11, 20, 16, 0.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:none;justify-content:center;align-items:center;padding:16px;z-index:100;}
.modal-overlay.active{display:flex;}
.modal-card{background:var(--card);border:1px solid var(--line-gold);border-radius:24px;width:100%;max-width:380px;padding:20px;position:relative;box-shadow:var(--halo-strong);max-height:88vh;overflow-y:auto;}
.modal-close{position:absolute;top:16px;right:16px;background:none;border:none;color:var(--mute);cursor:pointer;}

.dots{display:flex;justify-content:center;gap:6px;margin-bottom:16px;}
.dot{width:6px;height:6px;border-radius:50%;background:var(--sand);border:1px solid var(--line);}
.dot.active{width:22px;border-radius:4px;background:var(--gold);border-color:var(--gold);}

.modal-icon-box{width:52px;height:52px;border-radius:16px;background:var(--sand);border:1px solid var(--line-gold);color:var(--gold);display:grid;place-items:center;margin:0 auto 14px;box-shadow:var(--halo);}
.modal-title{font-size:18px;font-weight:800;text-align:center;margin-bottom:6px;color:var(--text);}
.modal-desc{font-size:12px;color:var(--mute);text-align:center;line-height:1.45;margin-bottom:16px;}

/* ---- time zone: schedule is shown in the user's own zone (default: the device's) ---- */
var TZ_LIST = [0, 60, 120, 180, 240, 300, 360];
var TZ_NAMES = {0:"GMT", 60:"CET / Poland", 120:"Kyiv / Baltics", 180:"MSK / Minsk", 240:"Dubai / Baku", 300:"Kazakhstan / Uzbekistan", 360:"Bishkek / Omsk"};
function tzLabel(m){ var h = m/60; return "UTC" + (h >= 0 ? "+" : "−") + Math.abs(h) + (TZ_NAMES[m] ? " (" + TZ_NAMES[m] + ")" : ""); }
S_initTz();
function S_initTz(){
  var off = -new Date().getTimezoneOffset();
  try{ var v = localStorage.getItem("ws_tz"); if(v !== null && v !== "" && !isNaN(parseInt(v,10))) off = parseInt(v,10); }catch(e){}
  S.tzOff = off;
}
function setTz(v){ S.tzOff = parseInt(v,10); try{ localStorage.setItem("ws_tz", String(S.tzOff)); }catch(e){} hap("s"); R(); }
function tzSelectHtml(){
  var list = TZ_LIST.slice();
  if(list.indexOf(S.tzOff) < 0){ list.push(S.tzOff); list.sort(function(a,b){ return a-b; }); }
  var h = '<select class="select-box" onchange="setTz(this.value)">';
  list.forEach(function(m){ h += '<option value="'+m+'"'+(m===S.tzOff?' selected':'')+'>'+tzLabel(m)+'</option>'; });
  return h + '</select>';
}
function pad2(n){ return (n<10?"0":"")+n; }
function nowSrv(){ return Date.now() + S.clockSkew; }
function fmtT(ms){ var d = new Date(ms + S.tzOff*60000); return pad2(d.getUTCHours()) + ":" + pad2(d.getUTCMinutes()); }
function dayIdx(ms){ return Math.floor((ms + S.tzOff*60000) / 86400000); }
function fmtDT(ms){
  var diff = dayIdx(ms) - dayIdx(nowSrv());
  if(diff === 0) return t("today") + " " + fmtT(ms);
  if(diff === 1) return t("tomorrow") + " " + fmtT(ms);
  return t("days")[new Date(ms + S.tzOff*60000).getUTCDay()] + " " + fmtT(ms);
}
/* minutes since SERVER midnight -> "HH:MM" in the user's zone (+1 / −1 marks the neighbouring day) */
function fmtSrvMin(m){
  var v = m + (S.tzOff - S.srvOff), shift = 0;
  while(v < 0){ v += 1440; shift--; }
  while(v >= 1440){ v -= 1440; shift++; }
  return pad2(Math.floor(v/60)) + ":" + pad2(v%60) + (shift ? (shift > 0 ? " +1" : " −1") : "");
}

/* ---- Server API layer ----
   Free-signal limit, registration status and events live on the server (see server.js).
   The client only displays state. Local testing without Telegram: open the page with ?dev=111:ivan
   (works only if the server runs with DEV_BYPASS_AUTH=1). */
function api(path, opts){
  opts = opts || {};
  var hdr = {"Content-Type":"application/json"};
  var init = (window.Telegram && Telegram.WebApp && Telegram.WebApp.initData) || "";
  if(init){ hdr["Authorization"] = "tma " + init; }
  else { var dev = new URLSearchParams(location.search).get("dev"); if(dev) hdr["x-dev-user"] = dev; }
  return fetch(path, {method: opts.method || "GET", headers: hdr, body: opts.body ? JSON.stringify(opts.body) : undefined})
    .then(function(r){ return r.json().catch(function(){return {}}).then(function(b){ return {status:r.status, body:b}; }); });
}
function applyServer(b){
  S.srv = b;
  S.unlimited = !!b.unlimited;      // deposited -> unlimited signals
  S.registered = !!b.registered;    // registered (or deposited)
  S.poId = b.traderId || "";
  S.freeLeft = b.freeLeft;
  S.freeLimit = b.freeLimit || 3;
  if(b.offer) S.offer = b.offer;
}
function track(action, details){ api("/api/track", {method:"POST", body:{action:action, details:details||null}}).catch(function(){}); }
function freeLeft(){ return S.freeLeft == null ? 0 : S.freeLeft; }
function isGated(){ return !S.unlimited && freeLeft() === 0 && S.ph === "idle"; }

function openExternal(u){
  try{ if(window.Telegram && Telegram.WebApp && Telegram.WebApp.openLink){ Telegram.WebApp.openLink(u); return; } }catch(e){}
  window.open(u, "_blank");
}

/* The partner postback is the only thing that moves a user forward, so while the user is registered but has not
   deposited we keep asking the server. The moment `ftd` arrives the banner disappears and signals become unlimited. */
var POLL = null;
function stopPolling(){ if(POLL){ clearInterval(POLL); POLL = null; } }
function startPolling(){ stopPolling(); POLL = setInterval(function(){ if(!document.hidden) checkStatus(false); }, 6000); }
function syncPolling(){
  if(S.unlimited){ stopPolling(); return; }
  if(S.loaded && S.registered && !POLL) startPolling();
}
function checkStatus(manual){
  return api("/api/me").then(function(r){
    if(r.status === 401){ S.authError = true; S.loaded = false; stopPolling(); R(); return; }
    if(r.status !== 200) return;
    var wasReg = S.registered, wasUnl = S.unlimited, prevLeft = S.freeLeft;
    applyServer(r.body);
    if(!wasUnl && S.unlimited){            // first deposit confirmed by the partner
      stopPolling(); hap(); openStep(8); R(); return;
    }
    if(!wasReg && S.registered){           // registration confirmed by the partner; keep polling for the deposit
      hap(); openStep(7); R(); syncPolling(); return;
    }
    var changed = prevLeft !== S.freeLeft;
    if(changed) R();
    if(manual) toast(S.registered && !S.unlimited ? t("depNotYet") : (changed ? t("statusUpdated") : t("statusSame")));
  }).catch(function(){ if(manual) toast(t("netError")); });
}
function openPartner(){
  if(S.partnerUrl){ openExternal(S.partnerUrl); return; }
  return api("/api/register/start", {method:"POST"}).then(function(r){
    if(r.status === 200){ S.partnerUrl = r.body.url; openExternal(r.body.url); } else { toast(t("netError")); }
  }).catch(function(){ toast(t("netError")); });
}
function startRegistration(){
  api("/api/register/start", {method:"POST"}).then(function(r){
    if(r.status !== 200){ toast(t("netError")); return; }
    S.partnerUrl = r.body.url;
    openExternal(r.body.url);
    openStep(6);
    startPolling();
  }).catch(function(){ toast(t("netError")); });
}
function openDeposit(){
  hap();
  api("/api/deposit/start", {method:"POST"}).then(function(r){
    if(r.status === 200){ openExternal(r.body.url); syncPolling(); }
    else if(r.status === 409){ checkStatus(false); }
    else { toast(t("netError")); }
  }).catch(function(){ toast(t("netError")); });
}
function copyPromo(){
  var c = S.offer.promoCode;
  function ok(){ hap("s"); toast(t("promoCopied")); }
  try{ if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(c).then(ok, ok); return; } }catch(e){}
  var ta = document.createElement("textarea"); ta.value = c; document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); }catch(e){}

/* ---- Trading schedule (server-side source of truth: lib/schedule.js) ---- */
function findAssetC(id){ for(var i=0;i<S.assets.length;i++){ if(S.assets[i].id === id) return S.assets[i]; } return null; }
function isOpen(a){
  if(a.open) return a.closesAt == null || nowSrv() < a.closesAt;
  return a.opensAt != null && nowSrv() >= a.opensAt;
}
function statusText(a){
  if(isOpen(a)) return a.open && a.closesAt != null ? tp("openUntil", {t: fmtT(a.closesAt)}) : (a.win === "all" ? t("open247") : t("openNow"));
  return a.opensAt != null && !a.open ? tp("opensAt", {t: fmtDT(a.opensAt)}) : t("closedLbl");
}
function pickDefaultAsset(){
  if(S.ph !== "idle") return false;
  var cur = findAssetC(S.asset);
  if(cur && isOpen(cur)) return false;
  var pick = null;
  ["EUR/USD", "EUR/USD-OTC"].forEach(function(id){ if(pick) return; var a = findAssetC(id); if(a && isOpen(a)) pick = a; });
  if(!pick){ for(var i=0;i<S.assets.length;i++){ if(isOpen(S.assets[i])){ pick = S.assets[i]; break; } } }
  if(pick && pick.id !== S.asset){ S.asset = pick.id; return true; }
  return false;
}
function loadAssets(){
  return api("/api/assets").then(function(r){
    if(r.status !== 200 || !r.body || !r.body.assets){ S.assetsErr = true; return false; }
    S.assetsErr = false;
    S.assets = r.body.assets; S.windows = r.body.windows; S.groups = r.body.groups;
    S.srvOff = r.body.serverOffsetMin; S.clockSkew = r.body.now - Date.now();
    return pickDefaultAsset();
  }).catch(function(){ S.assetsErr = true; return false; });
}
function refreshAssets(){
  var prev = S.asset;
  return loadAssets().then(function(changed){
    if(!S.loaded) return;
    if(changed && prev !== S.asset){ toast(tp("assetSwitched", {a: disp(prev), b: disp(S.asset)})); R(); return; }
    setAssetLabel();
    if(S.openMenu === "asset") refreshAssetList();
  });
}

function strHash(s) {
  var h = 0;
  for (var i = 0; i < s.length; i++) h = (Math.imul(31, h) + s.charCodeAt(i)) | 0;
  return Math.abs(h);
}

function calc(asset, tf){
  var x = strHash(asset + tf + new Date().toDateString());
  var moods = S.lang=="en"? MOODS_EN : MOODS_RU;
  return {a:asset, tf:tf, p:35+x%64, e:(x>>>5)%101, m:moods[(x>>>9)%moods.length]};
}

function getDailyWinrate() {
    const now = new Date();
    const utcTime = now.getTime() + (now.getTimezoneOffset() * 60000);
    const targetTime = new Date(utcTime + (3 * 3600000));
    const year = targetTime.getFullYear();
    const month = targetTime.getMonth();
    const day = targetTime.getDate();
    const seed = year * 10000 + (month + 1) * 100 + day;
    const random = Math.sin(seed) * 10000;
    const dayPseudoRandom = random - Math.floor(random);
    const min = 73;
    const max = 89;
    return Math.floor(dayPseudoRandom * (max - min + 1)) + min;
}

function toast(msg){var e=$("ts");e.textContent=msg;e.style.display="block";clearTimeout(S.tt);S.tt=setTimeout(function(){e.style.display="none"},Math.max(1800,Math.min(4500,String(msg).length*55)))}

function reset(){clearInterval(S.tm);S.ph="idle";S.r=null}

function start(){
  if(S.busy) return;
  var cur = findAssetC(S.asset);
  if(cur && !isOpen(cur)){ toast(tp("closedToast", {t: cur.opensAt ? fmtDT(cur.opensAt) : "—"})); refreshAssets(); return; }
  S.busy = true;
  api("/api/signal", {method:"POST", body:{asset:S.asset, timeframe:S.tf}}).then(function(r){
    S.busy = false;
    if(r.status === 401){ S.authError = true; S.loaded = false; R(); return; }
    if(r.body && r.body.status) applyServer(r.body);
    if(r.status === 409){                       // market closed / closes before expiry: no attempt was spent
      var e = r.body && r.body.error;
      if(e === "closing_soon") toast(tp("closingSoon", {n: r.body.minutesLeft}));
      else { toast(tp("closedToast", {t: r.body.opensAt ? fmtDT(r.body.opensAt) : "—"})); refreshAssets(); }
      R(); return;
    }
    if(r.status === 400){ toast(t("netError")); refreshAssets(); return; }
    if(r.status !== 200){ R(); return; }        // 403 = free limit reached -> redraw (paywall)
    runSignal();
  }).catch(function(){ S.busy = false; toast(t("netError")); });
}

function runSignal(){
  hap();
  clearInterval(S.tm);
  S.ph="load";
  S.r=null;
  closeMenuSmoothly();
  R();
  setTimeout(function(){
    S.r=calc(S.asset,S.tf);
    S.ph="res";
    S.t=15;
    R();
    S.tm=setInterval(function(){
      S.t--;
      if(S.t<=0){clearInterval(S.tm);S.t=0}
      var e=$("tt");
      if(e){e.textContent="00:"+("0"+S.t).slice(-2)+"/00:15"}
      if(S.t==0)R()
    },1000)
  },2500)
}

function decide(st){
  clearInterval(S.tm);
  track("signal_decision", {st:st, asset:S.r.a, tf:S.r.tf});
  S.hist.unshift({a:S.r.a, tf:S.r.tf, p:S.r.p, m:S.r.m, st:st, date:new Date().toLocaleTimeString()});
  save();
  toast(st=="ok" ? t("inWorkToast") : t("skipToast"));
  reset();
  R();
}

function assetRow(a){
  var open = isOpen(a);
  return '<div class="list-item '+(a.id===S.asset?"on ":"")+(open?"":"closed")+'" data-a="'+esc(a.id)+'" role="button" tabindex="0"'+(open?"":' aria-disabled="true"')+'>'

function renderAssetRows(){
  var q = S.assetSearch.toLowerCase();
  var items = S.assets.filter(function(a){
    if(q) return disp(a.id).toLowerCase().indexOf(q) >= 0;        // a search looks through every section
    return S.cat === "fav" ? isFav(a.id) : a.cat === S.cat;
  });
  var groups = [false, true].map(function(otc){
    var g = items.filter(function(a){ return a.otc === otc; })
                 .sort(function(x, y){ return (isOpen(y)?1:0) - (isOpen(x)?1:0); });   // open first (stable)
    return {otc: otc, items: g, anyOpen: g.some(isOpen)};
  }).filter(function(g){ return g.items.length; });
  if(groups.length === 2 && !groups[0].anyOpen && groups[1].anyOpen) groups.reverse();   // e.g. weekend: OTC on top
  var h = "";
  groups.forEach(function(g){
    h += '<div class="list-group-title">'+t(g.otc ? "marketOtc" : "marketOpen")+'</div>';
    g.items.forEach(function(a){ h += assetRow(a); });
  });
  if(!h){
    var msg = S.assets.length ? (S.cat === "fav" && !q ? t("favEmpty") : t("nothingFound")) : (S.assetsErr ? t("assetsErr") : t("loadingText"));
    h = '<div class="mute center" style="padding:18px 8px">'+msg+'</div>';

  return h;
}

function setCat(c){

/* ОБНОВЛЕННАЯ ПЛАВНАЯ ЛОГИКА ДЛЯ РАЗДЕЛА "СИГНАЛЫ" (БЕЗ РАЗРЫВОВ И ПЕРЕЗАГРУЗОК) */
function toggleMenu(targetMenu) {
  var wrapper = $("drop-wrapper");
  var inner = $("drop-inner");
  var pillAsset = $("btn-pill-asset");
  var pillTf = $("btn-pill-tf");

  if (S.openMenu === targetMenu) {
    closeMenuSmoothly();
  } else {
    S.openMenu = targetMenu;
    if (pillAsset) pillAsset.classList.toggle("on", targetMenu === 'asset');
    if (pillTf) pillTf.classList.toggle("on", targetMenu === 'tf');

    if (inner) {
      if (targetMenu === 'asset') {
        inner.innerHTML = '<div class="inline-dropdown">' + renderAssetContent() + '</div>';
        bindListEvents();
        bindSearch(true);
      } else if (targetMenu === 'tf') {
        inner.innerHTML = '<div class="inline-dropdown">' + renderTFContent() + '</div>';
        bindListEvents();
      }
    }
    if (wrapper) wrapper.classList.add("open");
  }
}

function closeMenuSmoothly() {
  S.openMenu = null;
  var wrapper = $("drop-wrapper");
  var pillAsset = $("btn-pill-asset");
  var pillTf = $("btn-pill-tf");
  if (wrapper) wrapper.classList.remove("open");
  if (pillAsset) pillAsset.classList.remove("on");
  if (pillTf) pillTf.classList.remove("on");
}

  setAssetLabel();

    if(el.getAttribute('data-a') === asset) {
      el.classList.add('on');
    } else {
      el.classList.remove('on');
    }
  });
  closeMenuSmoothly();
  reset();
}

function updateSelectedTF(tf) {
  S.tf = tf;
  var txt = $("lbl-tf");
  if (txt) txt.textContent = "⏱ " + S.tf;
  document.querySelectorAll('.flat-list .list-item[data-tf]').forEach(function(el){
    if(el.getAttribute('data-tf') === tf) {
      el.classList.add('on');
    } else {
      el.classList.remove('on');
    }
  });
  closeMenuSmoothly();

function bindListEvents(){
  document.querySelectorAll("#assets-holder .list-item[data-a]").forEach(function(row){
    row.onclick = function(e){
      if(e.target.closest(".fav-btn")) return;
      hap("s");
      if(this.classList.contains("closed")){          // a closed asset explains itself instead of silently ignoring the tap
        var a = findAssetC(this.dataset.a);
        if(a) toast(tp("closedToast", {t: a.opensAt ? fmtDT(a.opensAt) : "—"}));
        return;
      }
      updateSelectedAsset(this.dataset.a);
    };
    row.onkeydown = function(e){ if(e.key === "Enter" || e.key === " "){ e.preventDefault(); this.click(); } };
  });
  document.querySelectorAll("#assets-holder .fav-btn").forEach(function(b){
    b.onclick = function(e){ e.stopPropagation(); toggleFav(this.getAttribute("data-fav")); };
  });
  document.querySelectorAll(".flat-list button[data-tf]").forEach(function(btn){
    btn.onclick = function(e){ e.preventDefault(); hap("s"); updateSelectedTF(this.dataset.tf); };
  });
}

/* TRADING SCHEDULE SCREEN */
function openSchedule() {
  hap(); track("schedule_open");
  var overlay = $("modalOverlay"), modal = $("modalContent");
  overlay.classList.add("active");
  var now = nowSrv();
  var srvDow = new Date(now + S.srvOff*60000).getUTCDay();
  var localNow = t("days")[new Date(now + S.tzOff*60000).getUTCDay()] + " " + fmtT(now);
  var real = S.assets.filter(function(a){ return !a.otc; }), otc = S.assets.filter(function(a){ return a.otc; });
  var cnt = tp("schedOpenCnt", {a: real.filter(isOpen).length, b: real.length, c: otc.filter(isOpen).length});

  var rows = "";
  S.groups.forEach(function(g){
    var w = S.windows[g.wins[0]]; if(!w) return;
    var dayHtml = '<div class="day-chips">';
    [1,2,3,4,5,6,0].forEach(function(d){
      dayHtml += '<div class="day-chip '+(w.days.indexOf(d) >= 0 ? "on" : "")+(d === srvDow ? " now" : "")+'">'+t("days")[d]+'</div>';
    });
    dayHtml += '</div>';
    var hours = w.always ? t("sched24") : fmtSrvMin(w.o) + " – " + fmtSrvMin(w.c);
    var extra = "";
    if(g.wins.length > 1){
      var w2 = S.windows[g.wins[1]];
      var ids = S.assets.filter(function(a){ return !a.otc && a.win === g.wins[1]; }).map(function(a){ return a.id; }).join(", ");
      if(w2 && ids) extra = '<div class="mute" style="margin-top:6px">'+esc(tp("schedLate", {ids: ids, t: fmtSrvMin(w2.o)}))+'</div>';
    }
    rows += '<div class="sched-row"><div class="sched-name">'+t("grp_"+g.id)+'</div>'+dayHtml+'<div class="sched-hours">'+hours+'</div>'+extra+'</div>';
  });

  modal.innerHTML = `
    <button class="modal-close" onclick="closeModal()">${ic("x", 18)}</button>
    <div class="modal-icon-box">${ic("clock", 24)}</div>
    <div class="modal-title">${t("schedTitle")}</div>
    <div class="modal-desc" style="margin-bottom:10px">${t("schedNow")}: <b class="mono">${localNow}</b><br>${cnt}</div>
    ${rows}
    <div class="info-card" style="margin-top:6px">${tp("schedNote", {tz: tzLabel(S.tzOff)})}<br><br>${t("schedFoot")}</div>
    <button class="btn" onclick="closeModal()">${t("schedDone")}</button>
  `;
  if(window.lucide) lucide.createIcons();
}

    h+='<a href="https://t.me/AndromedaAI_Support_bot" target="_blank" style="text-decoration: none; color: inherit;"><div class="card" style="cursor:pointer">'+ic("message-square", 22)+'<b>Telegram</b><small>'+t("supDemo")+'</small></div></a>';
    h+='<div class="card" style="cursor:default">'+ic("clock", 22)+'<b>24/7</b><small>'+t("demoNote")+'</small></div>';
    h+='</div>';

    h+='<h3 style="margin-top:20px;">'+t("kbTitle")+'</h3>';
    var faqList = S.lang=="en"? FAQ_EN : FAQ_RU;
    faqList.forEach(function(item, idx){
      h+='<div class="faq" id="faq-'+idx+'">';
      h+='<button class="qb" onclick="hap();var el=$(\'faq-'+idx+'\');el.classList.toggle(\'o\')"><span>'+item[0]+'</span>'+ic("chevron-down", 16)+'</button>';
      h+='<div class="fa"><div><p>'+item[1]+'</p></div></div>';
      h+='</div>';
    });
  }
  v.innerHTML=h;

  if(S.tab=='f'){
    bindListEvents();
  }

  nav.innerHTML=`
    <button class="${S.tab=='p'?'on':''}" onclick="hap('s');S.tab='p';track('tab_view',{tab:'p'});reset();R()\">${ic("user")}<span>${t("navProfile")}</span></button>
    <button class="${S.tab=='h'?'on':''}" onclick="hap('s');S.tab='h';track('tab_view',{tab:'h'});reset();R()\">${ic("history")}<span>${t("navHistory")}</span></button>
    <button class="c ${S.tab=='f'?'on':''}" onclick="hap('s');S.tab='f';track('tab_view',{tab:'f'});reset();R()\"><i class="nav-center-icon">${ic("sparkles", 22)}</i><span>${t("navSignals")}</span></button>
    <button class="${S.tab=='a'?'on':''}" onclick="hap('s');S.tab='a';track('tab_view',{tab:'a'});reset();R()\">${ic("bot")}<span>${t("navAi")}</span></button>
    <button class="${S.tab=='s'?'on':''}" onclick="hap('s');S.tab='s';track('tab_view',{tab:'s'});reset();R()\">${ic("help-circle")}<span>${t("navSupport")}</span></button>
  `;

  if(window.lucide){
    lucide.createIcons();
  }
}

R();   // shows "Loading…" until the server answers
// Optional licensed logos: public/icons/manifest.json maps e.g. "stock:AAPL" -> "aapl.svg" (see README). Missing file = built-in icons.
fetch("/icons/manifest.json").then(function(r){ return r.ok ? r.json() : {}; }).then(function(m){
  AssetIcons.setOverrides(m);
  if(S.loaded){ setAssetLabel(); if(S.openMenu === "asset") refreshAssetList(true); }
}).catch(function(){});
api("/api/me?open=1").then(function(r){
  if(r.status === 200){ applyServer(r.body); S.loaded = true; return loadAssets(); }
  S.authError = true;
}).then(function(){ R(); syncPolling(); }).catch(function(){ S.netFail = true; R(); });

// Coming back from the browser (after registering / depositing): check immediately instead of waiting for the next poll.
document.addEventListener("visibilitychange", function(){
  if(!document.hidden && S.loaded){ if(S.registered && !S.unlimited) checkStatus(false); refreshAssets(); }
});
// Keep open/closed states fresh while the app stays open (markets open and close during the session).
setInterval(function(){ if(S.loaded && !document.hidden) refreshAssets(); }, 30000);
</script>
</body>
</html>
